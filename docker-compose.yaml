services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insurer
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: insurance_crm
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal_net
      - admin_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurer -d insurance_crm"]
      interval: 3s
      timeout: 3s
      retries: 5

  broker:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672" #(guest / guest)
    networks:
      - internal_net
      - admin_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://insurer:secret@db:5432/insurance_crm
      AMQP_URL: amqp://guest:guest@broker:5672/
    networks:
      - app_net
      - internal_net
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -u worker.py
    environment:
      DATABASE_URL: postgresql://insurer:secret@db:5432/insurance_crm
      AMQP_URL: amqp://guest:guest@broker:5672/
    networks:
      - internal_net
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./frontend/app.js:/usr/share/nginx/html/app.js:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_net

  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_net
    depends_on:
      - frontend
      - backend

networks:
  app_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true
  admin_net:
    driver: bridge

volumes:
  pgdata:
